<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bar Checklist</title>
<style>
:root {
  --teal: #1D9E75; --teal-light: #E1F5EE; --teal-dark: #085041;
  --blue: #378ADD; --blue-light: #E6F1FB; --blue-dark: #0C447C;
  --amber: #EF9F27; --amber-light: #FAEEDA; --amber-dark: #633806;
  --red: #E24B4A; --red-light: #FCEBEB; --red-dark: #791F1F;
  --g50: #F8F8F8; --g100: #F0F0F0; --g200: #E0E0E0;
  --g400: #9E9E9E; --g600: #616161; --g800: #212121;
  --r: 10px; --rsm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--g800); }
#app { display: flex; flex-direction: column; min-height: 100vh; }
#header { background: #fff; border-bottom: 1px solid var(--g200); padding: 14px 16px 0; position: sticky; top: 0; z-index: 100; }
#header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
#hotel-name { font-size: 17px; font-weight: 600; }
#sync-indicator { font-size: 12px; color: var(--g400); display: flex; align-items: center; gap: 4px; }
#sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--g200); flex-shrink: 0; }
#sync-dot.synced { background: var(--teal); }
#sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
#sync-dot.error { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
#shift-bar { font-size: 12px; color: var(--g600); padding: 6px 0 10px; }
#shift-bar span { font-weight: 600; color: var(--g800); }
#tabs { display: flex; }
.tab { flex: 1; padding: 10px 0; font-size: 13px; font-weight: 500; color: var(--g400); border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }
#content { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
.screen { display: none; }
.screen.visible { display: block; }
.lbl { font-size: 11px; font-weight: 600; color: var(--g400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
select { width: 100%; padding: 12px 14px; border-radius: var(--rsm); border: 1.5px solid var(--g200); background: #fff; font-size: 15px; color: var(--g800); appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%239E9E9E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; margin-bottom: 12px; }
select:focus { outline: none; border-color: var(--blue); }
.pill-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.pill { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--g200); background: #fff; font-size: 13px; font-weight: 500; color: var(--g600); cursor: pointer; }
.pill.active-apertura { background: var(--teal-light); border-color: var(--teal); color: var(--teal-dark); }
.pill.active-cierre { background: var(--blue-light); border-color: var(--blue); color: var(--blue-dark); }
.pill.active-montaje { background: var(--amber-light); border-color: var(--amber); color: var(--amber-dark); }
.outlet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
.outlet-card { background: #fff; border: 1.5px solid var(--g200); border-radius: var(--r); padding: 12px; cursor: pointer; }
.outlet-card.selected { border-color: var(--blue); background: var(--blue-light); }
.outlet-card.done { border-color: var(--teal); background: var(--teal-light); }
.outlet-card-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.outlet-card-prog { font-size: 11px; color: var(--g400); margin-bottom: 5px; }
.prog-bar { height: 3px; background: var(--g200); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 2px; transition: width .3s; background: var(--g400); }
.outlet-card.selected .prog-fill { background: var(--blue); }
.outlet-card.done .prog-fill { background: var(--teal); }
.checklist-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.checklist-title { font-size: 17px; font-weight: 600; }
.pct-badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
.pct-0 { background: var(--g100); color: var(--g600); }
.pct-part { background: var(--amber-light); color: var(--amber-dark); }
.pct-100 { background: var(--teal-light); color: var(--teal-dark); }
.sec-title { font-size: 11px; font-weight: 700; color: var(--g400); text-transform: uppercase; letter-spacing: .07em; margin: 16px 0 6px; }
.check-card { background: #fff; border-radius: var(--r); border: 1px solid var(--g200); overflow: hidden; margin-bottom: 4px; }
.check-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; border-bottom: 1px solid var(--g100); }
.check-item:last-child { border-bottom: none; }
.check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--g200); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.check-box.checked { background: var(--teal); border-color: var(--teal); }
.check-tick { display: none; }
.check-box.checked .check-tick { display: block; }
.check-text { font-size: 14px; line-height: 1.3; }
.check-text.done { color: var(--g400); text-decoration: line-through; }
.ts-bar { font-size: 11px; color: var(--g400); margin-bottom: 12px; }
.metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.metric { background: #fff; border-radius: var(--rsm); padding: 12px; text-align: center; border: 1px solid var(--g200); }
.metric-val { font-size: 22px; font-weight: 700; }
.metric-label { font-size: 11px; color: var(--g400); margin-top: 2px; }
.captain-card { background: #fff; border-radius: var(--r); border: 1px solid var(--g200); margin-bottom: 10px; overflow: hidden; }
.captain-card-header { padding: 12px 14px; border-bottom: 1px solid var(--g100); display: flex; align-items: center; justify-content: space-between; }
.captain-card-name { font-size: 15px; font-weight: 600; }
.dash-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--g100); }
.dash-row:last-child { border-bottom: none; }
.dash-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dash-outlet { font-size: 13px; flex: 1; }
.dash-type { font-size: 11px; color: var(--g400); }
.dash-ts { font-size: 11px; color: var(--g400); }
.dash-pct { font-size: 12px; font-weight: 600; min-width: 36px; text-align: right; }
.dash-bar-wrap { width: 50px; }
.refresh-btn { width: 100%; padding: 13px; background: var(--blue-light); color: var(--blue-dark); border: none; border-radius: var(--rsm); font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.shift-selector { display: flex; gap: 8px; margin-bottom: 16px; }
.shift-btn { flex: 1; padding: 12px; border-radius: var(--rsm); border: 1.5px solid var(--g200); background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--g600); }
.shift-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-dark); }
.dash-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.dash-filter-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--g200); background: #fff; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--g600); }
.dash-filter-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-dark); }
.config-section { background: #fff; border-radius: var(--r); border: 1px solid var(--g200); padding: 16px; margin-bottom: 12px; }
.config-section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.config-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.config-input { flex: 1; padding: 10px 12px; border-radius: var(--rsm); border: 1.5px solid var(--g200); font-size: 14px; }
.config-input:focus { outline: none; border-color: var(--blue); }
.btn-remove { padding: 8px 12px; background: var(--red-light); color: var(--red-dark); border: none; border-radius: var(--rsm); font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
.btn-add { width: 100%; padding: 10px; background: var(--g50); border: 1.5px dashed var(--g200); border-radius: var(--rsm); font-size: 13px; color: var(--g600); cursor: pointer; }
.btn-save { width: 100%; padding: 14px; background: var(--teal); color: #fff; border: none; border-radius: var(--rsm); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--g400); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
#loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; z-index: 999; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--g200); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div></div>
<div id="app">
  <div id="header">
    <div id="header-top">
      <span id="hotel-name">Bar Checklist</span>
      <span id="sync-indicator"><span id="sync-dot"></span><span id="sync-text">Conectando...</span></span>
    </div>
    <div id="shift-bar">Turno: <span id="current-shift-label">—</span></div>
    <div id="tabs">
      <button class="tab active" data-tab="captain">Capitán</button>
      <button class="tab" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="config">Ajustes</button>
    </div>
  </div>
  <div id="content">
    <!-- CAPITÁN -->
    <div id="screen-captain" class="screen visible">
      <div class="lbl">Turno activo</div>
      <div class="shift-selector">
        <button class="shift-btn" id="shift-am" onclick="setShift('AM')">☀️ AM</button>
        <button class="shift-btn" id="shift-pm" onclick="setShift('PM')">🌙 PM</button>
      </div>
      <div class="lbl">Tu nombre</div>
      <select id="captain-select"><option value="">— Selecciona —</option></select>
      <div class="pill-row" id="type-pills"></div>
      <div class="outlet-grid" id="outlet-grid"></div>
      <div id="checklist-area"></div>
    </div>
    <!-- DASHBOARD -->
    <div id="screen-dashboard" class="screen">
      <button class="refresh-btn" id="refresh-btn">↻ Actualizar dashboard</button>
      <div class="dash-filter" id="dash-filter"></div>
      <div class="metrics-row" id="dash-metrics"></div>
      <div id="dash-detail"></div>
    </div>
    <!-- CONFIG -->
    <div id="screen-config" class="screen">
      <div class="config-section">
        <div class="config-section-title">URL de la API</div>
        <input class="config-input" id="api-url-input" style="width:100%;margin-bottom:6px" placeholder="https://script.google.com/macros/s/.../exec">
        <div style="font-size:12px;color:var(--g400)">URL de Google Apps Script para sincronización.</div>
      </div>
      <div class="config-section">
        <div class="config-section-title">Nombre del hotel</div>
        <input class="config-input" id="hotel-name-input" style="width:100%" placeholder="Nombre del hotel">
      </div>
      <div class="config-section">
        <div class="config-section-title">Capitanes y sus outlets</div>
        <div id="captains-config"></div>
        <button class="btn-add" id="add-captain-btn">+ Agregar capitán</button>
      </div>
      <button class="btn-save" id="save-config-btn">Guardar y sincronizar configuración</button>
    </div>
  </div>
</div>

<script>
const API_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbyvhar96jquO1r1OggTniONJrCH9XoVgaozh0pT0PWESlHIB3c1GHGvdBeyZHQ7kfgV/exec';
let API_URL = localStorage.getItem('bar_api_url') || API_URL_DEFAULT;
if (!localStorage.getItem('bar_api_url')) localStorage.setItem('bar_api_url', API_URL);

const TURNO_LABELS = { apertura: 'Apertura', cierre: 'Cierre', montaje: 'Montaje' };
let config = null;
let records = {};
let currentCaptain = localStorage.getItem('bar_captain') || '';
let currentOutlet = '';
let currentType = 'apertura';
let currentShift = localStorage.getItem('bar_shift') || 'AM';
let syncTimeout = null;
let dashFilter = 'today';

function getToday() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function getShiftKey() {
  return getToday() + '_' + currentShift;
}

function recordKey(captain, outlet, type, item, shiftKey) {
  return captain + '|' + outlet + '|' + type + '|' + item + '|' + shiftKey;
}

// ---- JSONP ----
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    window[cb] = (data) => { delete window[cb]; el.remove(); resolve(data); };
    const el = document.createElement('script');
    el.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    el.onerror = () => { delete window[cb]; el.remove(); reject(new Error('JSONP error')); };
    document.head.appendChild(el);
  });
}

// ---- SERVER ----
async function loadFromServer() {
  const [cfgData, recData] = await Promise.all([
    jsonp(API_URL + '?action=getConfig'),
    jsonp(API_URL + '?action=getAll')
  ]);
  config = cfgData.config;
  localStorage.setItem('bar_config', JSON.stringify(config));
  records = {};
  if (recData.records) {
    recData.records.forEach(r => {
      const k = (r.captain||'') + '|' + (r.outlet||'') + '|' + (r.type||'') + '|' + (r.item||'') + '|' + (r.shiftkey||'');
      records[k] = { checked: r.checked === true || r.checked === 'TRUE', timestamp: r.timestamp };
    });
  }
  localStorage.setItem('bar_records', JSON.stringify(records));
}

function loadFromLocal() {
  const sc = localStorage.getItem('bar_config');
  config = sc ? JSON.parse(sc) : getDefaultConfig();
  const sr = localStorage.getItem('bar_records');
  records = sr ? JSON.parse(sr) : {};
}

async function syncCheck(captain, outlet, type, item, checked) {
  const sk = getShiftKey();
  const k = recordKey(captain, outlet, type, item, sk);
  const ts = new Date().toISOString();
  records[k] = { checked, timestamp: ts };
  localStorage.setItem('bar_records', JSON.stringify(records));
  if (!API_URL) return;
  setSyncState('syncing');
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async () => {
    try {
      await jsonp(API_URL + '?action=saveCheck&captain=' + encodeURIComponent(captain) + '&outlet=' + encodeURIComponent(outlet) + '&type=' + encodeURIComponent(type) + '&item=' + encodeURIComponent(item) + '&checked=' + checked + '&shiftkey=' + encodeURIComponent(sk));
      setSyncState('synced');
    } catch(e) { setSyncState('error'); }
  }, 600);
}

async function syncConfigToServer(cfg) {
  if (!API_URL) return;
  setSyncState('syncing');
  try {
    await jsonp(API_URL + '?action=saveConfig&data=' + encodeURIComponent(JSON.stringify(cfg)));
    setSyncState('synced');
  } catch(e) { setSyncState('error'); }
}

// ---- INIT ----
async function init() {
  loadFromLocal();
  buildUI();
  showLoading(false);
  setSyncState('syncing');
  try {
    await loadFromServer();
    buildUI();
    setSyncState('synced');
  } catch(e) { setSyncState('error'); }
}

// ---- UI HELPERS ----
function setSyncState(s) {
  document.getElementById('sync-dot').className = s;
  document.getElementById('sync-text').textContent = s === 'synced' ? 'Sincronizado' : s === 'syncing' ? 'Sincronizando...' : 'Sin conexión';
}
function showLoading(v) { document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none'; }

function setShift(s) {
  currentShift = s;
  localStorage.setItem('bar_shift', s);
  document.getElementById('shift-am').className = 'shift-btn' + (s === 'AM' ? ' active' : '');
  document.getElementById('shift-pm').className = 'shift-btn' + (s === 'PM' ? ' active' : '');
  document.getElementById('current-shift-label').textContent = getToday() + ' · ' + s;
  renderOutletGrid();
  renderChecklist();
}

function getProgress(captain, outlet, type, shiftKey) {
  const sk = shiftKey || getShiftKey();
  const sections = config.checklists[type] || {};
  const items = Object.values(sections).flat();
  if (!items.length) return { done: 0, total: 0, pct: 0 };
  const done = items.filter(item => records[recordKey(captain, outlet, type, item, sk)]?.checked).length;
  return { done, total: items.length, pct: Math.round(done / items.length * 100) };
}

function getLastTs(captain, outlet, type, shiftKey) {
  const sk = shiftKey || getShiftKey();
  const sections = config.checklists[type] || {};
  const items = Object.values(sections).flat();
  let latest = null;
  items.forEach(item => {
    const ts = records[recordKey(captain, outlet, type, item, sk)]?.timestamp;
    if (ts && (!latest || ts > latest)) latest = ts;
  });
  if (!latest) return null;
  return new Date(latest).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

// ---- BUILD UI ----
function buildUI() {
  document.getElementById('hotel-name').textContent = config.hotelName || 'Bar Checklist';
  setShift(currentShift);
  buildCaptainSelect();
  buildTypePills();
  renderOutletGrid();
  renderChecklist();
  if (currentCaptain) document.getElementById('captain-select').value = currentCaptain;
}

function buildCaptainSelect() {
  const sel = document.getElementById('captain-select');
  sel.innerHTML = '<option value="">— Selecciona tu nombre —</option>';
  config.captains.forEach(c => {
    const o = document.createElement('option');
    o.value = c.name; o.textContent = c.name; sel.appendChild(o);
  });
  sel.onchange = () => {
    currentCaptain = sel.value;
    currentOutlet = '';
    localStorage.setItem('bar_captain', currentCaptain);
    renderOutletGrid(); renderChecklist();
  };
}

function buildTypePills() {
  const el = document.getElementById('type-pills');
  el.innerHTML = '';
  Object.keys(config.checklists).forEach(t => {
    const b = document.createElement('button');
    b.className = 'pill' + (t === currentType ? ' active-' + t : '');
    b.textContent = TURNO_LABELS[t] || t;
    b.onclick = () => {
      currentType = t;
      document.querySelectorAll('.pill').forEach(x => x.className = 'pill');
      b.className = 'pill active-' + t;
      renderOutletGrid(); renderChecklist();
    };
    el.appendChild(b);
  });
}

function renderOutletGrid() {
  const el = document.getElementById('outlet-grid');
  el.innerHTML = '';
  if (!currentCaptain) return;
  const cap = config.captains.find(c => c.name === currentCaptain);
  if (!cap) return;
  cap.outlets.forEach(o => {
    const p = getProgress(currentCaptain, o, currentType);
    const card = document.createElement('div');
    card.className = 'outlet-card' + (o === currentOutlet ? ' selected' : '') + (p.pct === 100 ? ' done' : '');
    card.innerHTML = '<div class="outlet-card-name">' + o + '</div><div class="outlet-card-prog">' + p.done + '/' + p.total + '</div><div class="prog-bar"><div class="prog-fill" style="width:' + p.pct + '%"></div></div>';
    card.onclick = () => { currentOutlet = o; renderOutletGrid(); renderChecklist(); };
    el.appendChild(card);
  });
}

function renderChecklist() {
  const el = document.getElementById('checklist-area');
  el.innerHTML = '';
  if (!currentCaptain || !currentOutlet) {
    el.innerHTML = '<div class="empty-state"><div class="icon">▶</div><p>' + (!currentCaptain ? 'Selecciona tu nombre para comenzar' : 'Selecciona un outlet') + '</p></div>';
    return;
  }
  const p = getProgress(currentCaptain, currentOutlet, currentType);
  const ts = getLastTs(currentCaptain, currentOutlet, currentType);
  const pctClass = p.pct === 0 ? 'pct-0' : p.pct === 100 ? 'pct-100' : 'pct-part';
  const header = document.createElement('div');
  header.className = 'checklist-header';
  header.innerHTML = '<div class="checklist-title">' + currentOutlet + '</div><span class="pct-badge ' + pctClass + '">' + p.pct + '%</span>';
  el.appendChild(header);
  if (ts) { const t = document.createElement('div'); t.className = 'ts-bar'; t.textContent = 'Actualizado: ' + ts; el.appendChild(t); }
  const sections = config.checklists[currentType] || {};
  Object.entries(sections).forEach(([sec, items]) => {
    const st = document.createElement('div'); st.className = 'sec-title'; st.textContent = sec; el.appendChild(st);
    const card = document.createElement('div'); card.className = 'check-card';
    items.forEach(item => {
      const sk = getShiftKey();
      const k = recordKey(currentCaptain, currentOutlet, currentType, item, sk);
      const checked = records[k]?.checked || false;
      const row = document.createElement('div'); row.className = 'check-item';
      row.innerHTML = '<div class="check-box' + (checked ? ' checked' : '') + '"><svg class="check-tick" width="13" height="13" viewBox="0 0 13 13" fill="none"><polyline points="2,6.5 5.5,10 11,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="check-text' + (checked ? ' done' : '') + '">' + item + '</span>';
      row.onclick = () => { syncCheck(currentCaptain, currentOutlet, currentType, item, !checked); renderOutletGrid(); renderChecklist(); };
      card.appendChild(row);
    });
    el.appendChild(card);
  });
}

// ---- DASHBOARD ----
function getAvailableShiftKeys() {
  const keys = new Set();
  Object.keys(records).forEach(k => {
    const parts = k.split('|');
    if (parts.length === 5) keys.add(parts[4]);
  });
  keys.add(getShiftKey());
  return Array.from(keys).sort().reverse();
}

function renderDashboard() {
  const metricsEl = document.getElementById('dash-metrics');
  const detailEl = document.getElementById('dash-detail');
  const filterEl = document.getElementById('dash-filter');
  metricsEl.innerHTML = ''; detailEl.innerHTML = ''; filterEl.innerHTML = '';

  const allKeys = getAvailableShiftKeys();
  const today = getToday();
  
  // Filter buttons
  const filters = [
    { id: 'today', label: 'Hoy' },
    { id: 'all', label: 'Todo el historial' }
  ];
  filters.forEach(f => {
    const b = document.createElement('button');
    b.className = 'dash-filter-btn' + (dashFilter === f.id ? ' active' : '');
    b.textContent = f.label;
    b.onclick = () => { dashFilter = f.id; renderDashboard(); };
    filterEl.appendChild(b);
  });

  // Also add individual shift keys for today
  allKeys.filter(k => k.startsWith(today)).forEach(k => {
    const b = document.createElement('button');
    const label = k.replace(today + '_', '') ;
    b.className = 'dash-filter-btn' + (dashFilter === k ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { dashFilter = k; renderDashboard(); };
    filterEl.appendChild(b);
  });

  const activeKeys = dashFilter === 'all' ? allKeys : dashFilter === 'today' ? allKeys.filter(k => k.startsWith(today)) : [dashFilter];

  const types = Object.keys(config.checklists);
  let totalDone = 0, totalItems = 0, completedChecklists = 0, totalChecklists = 0;

  config.captains.forEach(cap => {
    cap.outlets.forEach(out => {
      types.forEach(type => {
        activeKeys.forEach(sk => {
          const p = getProgress(cap.name, out, type, sk);
          totalDone += p.done; totalItems += p.total; totalChecklists++;
          if (p.pct === 100) completedChecklists++;
        });
      });
    });
  });

  const overall = totalItems > 0 ? Math.round(totalDone / totalItems * 100) : 0;
  [{ val: overall + '%', label: 'Progreso' }, { val: completedChecklists + '/' + totalChecklists, label: 'Completos' }, { val: totalDone + '/' + totalItems, label: 'Ítems' }].forEach(m => {
    const d = document.createElement('div'); d.className = 'metric';
    d.innerHTML = '<div class="metric-val">' + m.val + '</div><div class="metric-label">' + m.label + '</div>';
    metricsEl.appendChild(d);
  });

  config.captains.forEach(cap => {
    let capDone = 0, capTotal = 0;
    cap.outlets.forEach(out => { types.forEach(type => { activeKeys.forEach(sk => { const p = getProgress(cap.name, out, type, sk); capDone += p.done; capTotal += p.total; }); }); });
    const capPct = capTotal > 0 ? Math.round(capDone / capTotal * 100) : 0;
    const card = document.createElement('div'); card.className = 'captain-card';
    card.innerHTML = '<div class="captain-card-header"><span class="captain-card-name">' + cap.name + '</span><span style="font-size:13px;color:var(--g400)">' + capPct + '%</span></div>';
    cap.outlets.forEach(out => {
      types.forEach(type => {
        activeKeys.forEach(sk => {
          const p = getProgress(cap.name, out, type, sk);
          if (p.done === 0 && dashFilter === 'today' && activeKeys.length > 1) return;
          const ts = getLastTs(cap.name, out, type, sk);
          const dotColor = p.pct === 100 ? '#1D9E75' : p.pct > 0 ? '#EF9F27' : '#E0E0E0';
          const shiftLabel = sk ? ' <span style="font-size:10px;color:var(--g400)">' + sk + '</span>' : '';
          const row = document.createElement('div'); row.className = 'dash-row';
          row.innerHTML = '<div class="dash-dot" style="background:' + dotColor + '"></div><div style="flex:1"><div class="dash-outlet">' + out + ' <span class="dash-type">' + (TURNO_LABELS[type]||type) + '</span>' + shiftLabel + '</div>' + (ts ? '<div class="dash-ts">' + ts + '</div>' : '') + '</div><div class="dash-pct" style="color:' + dotColor + '">' + p.pct + '%</div><div class="dash-bar-wrap"><div class="prog-bar"><div class="prog-fill" style="width:' + p.pct + '%;background:' + dotColor + '"></div></div></div>';
          card.appendChild(row);
        });
      });
    });
    detailEl.appendChild(card);
  });
}

// ---- CONFIG SCREEN ----
function renderConfigScreen() {
  document.getElementById('api-url-input').value = API_URL;
  document.getElementById('hotel-name-input').value = config.hotelName || '';
  const capCfg = document.getElementById('captains-config');
  capCfg.innerHTML = '';
  config.captains.forEach((cap, ci) => {
    const section = document.createElement('div');
    section.style.cssText = 'border:1px solid #E0E0E0;border-radius:8px;padding:10px;margin-bottom:10px;background:#FAFAFA';
    const nameRow = document.createElement('div'); nameRow.className = 'config-row';
    nameRow.innerHTML = '<input class="config-input" placeholder="Nombre del capitán" value="' + cap.name + '" data-ci="' + ci + '" data-field="name"><button class="btn-remove" data-ci="' + ci + '">Eliminar</button>';
    section.appendChild(nameRow);
    const outLabel = document.createElement('div');
    outLabel.style.cssText = 'font-size:11px;color:#9E9E9E;margin-bottom:6px;margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em';
    outLabel.textContent = 'Outlets'; section.appendChild(outLabel);
    cap.outlets.forEach((out, oi) => {
      const row = document.createElement('div'); row.className = 'config-row';
      row.innerHTML = '<input class="config-input" placeholder="Nombre del outlet" value="' + out + '" data-ci="' + ci + '" data-oi="' + oi + '" data-field="outlet"><button class="btn-remove" data-ci="' + ci + '" data-oi="' + oi + '">-</button>';
      section.appendChild(row);
    });
    const addOut = document.createElement('button'); addOut.className = 'btn-add'; addOut.textContent = '+ Agregar outlet'; addOut.style.marginTop = '4px'; addOut.dataset.ci = ci;
    addOut.onclick = () => { config.captains[ci].outlets.push(''); renderConfigScreen(); };
    section.appendChild(addOut);
    capCfg.appendChild(section);
  });
  capCfg.querySelectorAll('input[data-field="name"]').forEach(inp => { inp.oninput = () => { config.captains[parseInt(inp.dataset.ci)].name = inp.value; }; });
  capCfg.querySelectorAll('input[data-field="outlet"]').forEach(inp => { inp.oninput = () => { config.captains[parseInt(inp.dataset.ci)].outlets[parseInt(inp.dataset.oi)] = inp.value; }; });
  capCfg.querySelectorAll('button[data-ci]').forEach(btn => {
    btn.onclick = () => {
      const ci = parseInt(btn.dataset.ci);
      if (btn.dataset.oi !== undefined) { config.captains[ci].outlets.splice(parseInt(btn.dataset.oi), 1); }
      else { config.captains.splice(ci, 1); }
      renderConfigScreen();
    };
  });
}

document.getElementById('add-captain-btn').onclick = () => { config.captains.push({ name: '', outlets: [''] }); renderConfigScreen(); };
document.getElementById('save-config-btn').onclick = async () => {
  const newUrl = document.getElementById('api-url-input').value.trim();
  API_URL = newUrl; localStorage.setItem('bar_api_url', API_URL);
  config.hotelName = document.getElementById('hotel-name-input').value.trim();
  localStorage.setItem('bar_config', JSON.stringify(config));
  await syncConfigToServer(config);
  buildUI(); alert('Configuración guardada.');
};

// ---- TABS ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
    tab.classList.add('active');
    document.getElementById('screen-' + tab.dataset.tab).classList.add('visible');
    if (tab.dataset.tab === 'dashboard') { loadFromLocal(); if (API_URL) loadFromServer().then(() => { renderDashboard(); setSyncState('synced'); }).catch(() => setSyncState('error')); else renderDashboard(); }
    if (tab.dataset.tab === 'config') renderConfigScreen();
  };
});

document.getElementById('refresh-btn').onclick = async () => {
  setSyncState('syncing');
  try { await loadFromServer(); renderDashboard(); setSyncState('synced'); } catch(e) { setSyncState('error'); }
};
